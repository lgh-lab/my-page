<!DOCTYPE html>
<html lang="ko"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소개</title>
    <style>
        /* 기본 변수 정의 - 다크 모드 기본 */
        :root {
            --bg-gradient: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            --card-bg: rgba(255, 255, 255, 0.07);
            --card-border: rgba(255, 255, 255, 0.18);
            --text-color: #ffffff;
            --sub-text: #b3b3b3;
            --accent-glow: #00f0ff;
            --accent-secondary: #7000ff;
            --accent-pink: #ff007f;
            --shadow-color: rgba(0, 240, 255, 0.2);
            --star-color: #ffffff;
        }

        /* 라이트 모드 변수 */
        [data-theme="light"] {
            --bg-gradient: radial-gradient(ellipse at top, #e6f0ff 0%, #c9d6ff 100%);
            --card-bg: rgba(255, 255, 255, 0.65);
            --card-border: rgba(0, 100, 255, 0.2);
            --text-color: #1a1a2e;
            --sub-text: #4a4a6a;
            --accent-glow: #0066ff;
            --accent-secondary: #9900ff;
            --accent-pink: #d9006c;
            --shadow-color: rgba(0, 102, 255, 0.15);
            --star-color: #335588;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.5s ease, color 0.5s ease;
            position: relative;
            padding-bottom: 60px;
        }

        /* 우주 별빛 배경 Canvas */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* 메인 컨테이너 */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* 상단 모드 전환 버튼 */
        .header-actions {
            display: flex;
            justify-content: flex-end;
            padding: 10px 0;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px var(--shadow-color);
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: translateY(-2px);
            border-color: var(--accent-glow);
        }

        /* 히어로 섹션 */
        .hero {
            text-align: center;
            margin: 30px 0 50px;
        }

        .hero-badge {
            display: inline-block;
            padding: 6px 16px;
            background: linear-gradient(90deg, var(--accent-secondary), var(--accent-glow));
            color: #fff;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 15px;
            box-shadow: 0 0 15px var(--accent-glow);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        .hero-title {
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 30%, var(--accent-glow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px var(--shadow-color);
        }

        [data-theme="light"] .hero-title {
            background: linear-gradient(135deg, #1a1a2e 30%, var(--accent-glow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--sub-text);
            line-height: 1.6;
        }

        /* 카드 섹션 - 좋아하는 것 3가지 */
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 40px 0 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            perspective: 1000px;
        }

        .card-container {
            height: 280px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 20px;
        }

        .card-container.flipped .card {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        .card-front {
            transition: border-color 0.3s;
        }

        .card-container:hover .card-front {
            border-color: var(--accent-glow);
            box-shadow: 0 0 20px var(--shadow-color);
        }

        .card-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px var(--accent-glow));
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card-hint {
            font-size: 0.8rem;
            color: var(--sub-text);
            margin-top: 10px;
            opacity: 0.7;
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, var(--card-bg), rgba(112, 0, 255, 0.15));
            border-color: var(--accent-glow);
        }

        .card-back-text {
            font-size: 1rem;
            line-height: 1.6;
            word-break: keep-all;
        }

        /* OX 퀴즈 섹션 */
        .quiz-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .quiz-question {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .quiz-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .quiz-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--card-border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            font-size: 2rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .quiz-btn.btn-o {
            color: #00ff88;
            border-color: rgba(0, 255, 136, 0.4);
        }

        .quiz-btn.btn-x {
            color: #ff4757;
            border-color: rgba(255, 71, 87, 0.4);
        }

        .quiz-btn:hover {
            transform: scale(1.15);
        }

        .quiz-btn.btn-o:hover {
            background: rgba(0, 255, 136, 0.2);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.5);
        }

        .quiz-btn.btn-x:hover {
            background: rgba(255, 71, 87, 0.2);
            box-shadow: 0 0 25px rgba(255, 71, 87, 0.5);
        }

        .quiz-result {
            margin-top: 20px;
            font-weight: 700;
            min-height: 28px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        /* 운세 뽑기 섹션 */
        .fortune-section {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 35px 20px;
            text-align: center;
            margin-top: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        .fortune-btn {
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-pink));
            color: white;
            border: none;
            padding: 16px 36px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(112, 0, 255, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .fortune-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.6);
        }

        .fortune-btn:active {
            transform: translateY(1px);
        }

        .fortune-display {
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px dashed var(--card-border);
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.5;
            color: var(--accent-glow);
            word-break: keep-all;
        }

        [data-theme="light"] .fortune-display {
            background: rgba(255, 255, 255, 0.4);
        }

        /* 화면 흔들림 Keyframe 애니메이션 */
        .shake {
            animation: spaceShake 0.6s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes spaceShake {
            10%, 90% { transform: translate3d(-3px, -2px, 0) rotate(-1deg); }
            20%, 80% { transform: translate3d(4px, 3px, 0) rotate(1deg); }
            30%, 50%, 70% { transform: translate3d(-6px, 4px, 0) rotate(-2deg); }
            40%, 60% { transform: translate3d(6px, -4px, 0) rotate(2deg); }
        }

        /* 폭죽 및 이펙트 파티클 Canvas */
        #effectCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* 푸터 */
        footer {
            text-align: center;
            margin-top: 50px;
            color: var(--sub-text);
            font-size: 0.85rem;
        }

        /* 모바일 대응 레이아웃 */
        @media (max-width: 600px) {
            .hero-title {
                font-size: 2.1rem;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }

            .card-container {
                height: 220px;
            }

            .quiz-btn {
                width: 70px;
                height: 70px;
                font-size: 1.7rem;
            }
        }
    </style>
